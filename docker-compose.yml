services:
  backend:
    build: ./backend
    container_name: utf_backend
    env_file: .env
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - redis
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VOLUNTEER_APP_CONTAINER_PORT: ${VOLUNTEER_APP_CONTAINER_PORT:-5173}
    container_name: utf_frontend
    env_file: .env
    ports:
      - "${VOLUNTEER_APP_PORT:-5173}:${VOLUNTEER_APP_CONTAINER_PORT:-5173}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_DEV_SERVER_PORT: ${VOLUNTEER_APP_CONTAINER_PORT:-5173}
      VITE_PROXY_TARGET: http://backend:8000

  redis:
    image: redis:7-alpine
    container_name: utf_redis
    ports:
      - "${REDIS_PORT:-6380}:6379"

  celery:
    build: ./backend
    container_name: utf_celery
    env_file: .env
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    depends_on:
      - redis
      - backend
    command: celery -A config worker -l info

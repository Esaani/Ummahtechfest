# Example: add more React portals alongside the volunteer app.
# Copy the frontend service block, set unique env ports, then:
#   docker compose -f docker-compose.yml -f docker-compose.portals.example.yml up -d
#
# Do not forget to add new origins to CORS_ALLOWED_ORIGINS in .env

services:
  registration_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VOLUNTEER_APP_CONTAINER_PORT: ${REGISTRATION_APP_CONTAINER_PORT:-5173}
    container_name: utf_registration_frontend
    env_file: .env
    ports:
      - "${REGISTRATION_APP_PORT:-5174}:${REGISTRATION_APP_CONTAINER_PORT:-5173}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_DEV_SERVER_PORT: ${REGISTRATION_APP_CONTAINER_PORT:-5173}
      VITE_PROXY_TARGET: http://backend:8000

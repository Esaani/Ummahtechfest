<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      background-color: #131313;
    }
    table, td {
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    img {
      border: 0;
      height: auto;
      line-height: 100%;
      outline: none;
      text-decoration: none;
      -ms-interpolation-mode: bicubic;
    }
    p {
      display: block;
      margin: 16px 0;
    }
    .email-container {
      max-width: 600px;
      margin: 32px auto;
      background-color: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .header {
      padding: 36px 48px;
      text-align: center;
      background-color: #131313;
      border-bottom: 2px solid #a3fa01;
    }
    .content {
      padding: 48px;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    .footer {
      padding: 28px 48px;
      background-color: #131313;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }
    .button {
      display: inline-block;
      padding: 14px 36px;
      background-color: #a3fa01;
      color: #131313 !important;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 999px;
      margin-top: 8px;
    }
    .preheader {
      display: none;
      max-height: 0px;
      overflow: hidden;
      mso-hide: all;
    }
  </style>
</head>
<body>
  <div class="preheader">
    {% block preheader %}{% endblock %}
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #131313; padding: 20px 0;">
    <tr>
      <td align="center">
        <div class="email-container">
          <div class="header">
            <a href="{{ site_url }}" target="_blank">
              <img src="{{ logo_url }}" alt="{{ site_name }}" width="160" style="display: block; margin: 0 auto;">
            </a>
          </div>

          <div class="content">
            {% block content %}{% endblock %}
          </div>

          <div class="footer">
            <p style="margin: 0 0 6px; font-weight: 700; color: #a3fa01; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;">{{ site_name }}</p>
            <p style="margin: 0 0 16px; color: #94a3b8; font-size: 12px;">The Premier Tech Conference for the Global Ummah</p>
            <div style="margin-bottom: 16px;">
              <a href="{{ site_url }}" style="color: #a3fa01; text-decoration: none; margin: 0 8px; font-size: 12px;">Website</a>
              <span style="color: #334155;">&bull;</span>
              <a href="mailto:{{ support_email }}" style="color: #a3fa01; text-decoration: none; margin: 0 8px; font-size: 12px;">Contact us</a>
            </div>
            <p style="margin: 0; font-size: 11px; color: #475569;">
              &copy; 2026 Ummah Tech Fest. All rights reserved.<br>
              You received this email because you have an account on our platform.
            </p>
          </div>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>

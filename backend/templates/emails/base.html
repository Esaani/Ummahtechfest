<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      background-color: #f4f4f5;
    }
    table, td {
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    img {
      border: 0;
      height: auto;
      line-height: 100%;
      outline: none;
      text-decoration: none;
      -ms-interpolation-mode: bicubic;
    }
    p {
      display: block;
      margin: 16px 0;
    }
    .email-container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .header {
      padding: 32px 48px;
      text-align: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
    .content {
      padding: 48px;
      color: #334155;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    .footer {
      padding: 32px 48px;
      background-color: #f8fafc;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }
    .button {
      display: inline-block;
      padding: 14px 32px;
      background-color: #c9a227;
      color: #ffffff !important;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 8px;
    }
    .preheader {
      display: none;
      max-height: 0px;
      overflow: hidden;
      mso-hide: all;
    }
  </style>
</head>
<body>
  <div class="preheader">
    {% block preheader %}{% endblock %}
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f4f4f5; padding: 20px 0;">
    <tr>
      <td align="center">
        <div class="email-container">
          <!-- Header with Logo -->
          <div class="header">
            <a href="{{ site_url }}" target="_blank">
              <img src="{{ site_url }}/assets/images/Ummah-tech-Fest-logo.png" alt="{{ site_name }}" width="180" style="display: block; margin: 0 auto;">
            </a>
          </div>

          <!-- Body Content -->
          <div class="content">
            {% block content %}{% endblock %}
          </div>

          <!-- Footer -->
          <div class="footer">
            <p style="margin: 0 0 12px; font-weight: 600; color: #475569;">{{ site_name }}</p>
            <p style="margin: 0 0 20px;">The Premier Tech Conference for the Global Ummah</p>
            
            <div style="margin-bottom: 24px;">
              <a href="{{ site_url }}" style="color: #c9a227; text-decoration: none; margin: 0 10px;">Website</a>
              <span style="color: #cbd5e1;">&bull;</span>
              <a href="mailto:{{ support_email }}" style="color: #c9a227; text-decoration: none; margin: 0 10px;">Support</a>
            </div>

            <p style="margin: 0; font-size: 12px; color: #94a3b8;">
              &copy; 2026 Ummah Tech Fest. All rights reserved.<br>
              You received this email because you registered on our platform.
            </p>
          </div>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>

{% extends "emails/base.html" %}
{% block title %}Registration received — {{ site_name }}{% endblock %}
{% block content %}
<h1 style="margin: 0 0 16px; font-size: 24px; font-weight: 700; color: #0f172a;">Registration received</h1>
<p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6; color: #334155;">
  Assalamu Alaikum {{ first_name }},
</p>
<p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6; color: #334155;">
  Your <strong>{{ pass_title }}</strong> registration is on file. We will share next steps as they become available.
</p>
{% endblock %}

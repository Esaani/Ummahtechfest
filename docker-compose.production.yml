# Production overrides — use WITH docker-compose.yml (no nginx container).
# Host nginx: see nginx/host-production.conf and nginx/HOST_SETUP.md
#
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build

services:
  backend:
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes: []
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    volumes: []
    ports:
      - "127.0.0.1:${FRONTEND_STATIC_PORT:-8081}:80"

  celery:
    volumes: []

  # Do not run the dev nginx container in production — use host nginx instead.

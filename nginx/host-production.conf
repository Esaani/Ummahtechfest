# Host nginx — Ummah Tech Fest (production)
#
# Use this on your machine's nginx (not the Docker nginx service).
# Must match .env / .env.live on this server:
#   - API:      127.0.0.1:<API_PORT>      (default 8000; e.g. 8200 on live)
#   - Frontend: 127.0.0.1:<FRONTEND_STATIC_PORT>  (default 8081; e.g. 8082 on live)
#
# Install:
#   sudo cp nginx/host-production.conf /etc/nginx/sites-available/ummah-tech-fest
#   sudo ln -sf /etc/nginx/sites-available/ummah-tech-fest /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name and SSL paths if you terminate TLS on this host.

upstream utf_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream utf_frontend {
    server 127.0.0.1:8081;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name ummahtechfest.com www.ummahtechfest.com;

    client_max_body_size 55M;

    # Redirect HTTP to HTTPS when certificates are configured (uncomment in production):
    # return 301 https://$host$request_uri;

    location /api/ {
        proxy_pass http://utf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /admin/ {
        proxy_pass http://utf_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://utf_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://utf_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://utf_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


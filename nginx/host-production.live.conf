# Live server nginx — matches .env.live (API_PORT=8200, FRONTEND_STATIC_PORT=8082)
#
#   sudo cp nginx/host-production.live.conf /etc/nginx/sites-available/ummah-tech-fest
#   sudo ln -sf /etc/nginx/sites-available/ummah-tech-fest /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream utf_backend {
    server 127.0.0.1:8200;
    keepalive 16;
}

upstream utf_frontend {
    server 127.0.0.1:8082;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name ummahtechfest.com www.ummahtechfest.com;

    client_max_body_size 55M;

    location /api/ {
        proxy_pass http://utf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /admin/ {
        proxy_pass http://utf_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://utf_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://utf_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://utf_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

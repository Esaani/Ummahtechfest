# Live server — API 127.0.0.1:8200, frontend 127.0.0.1:8082 (see .env API_PORT / FRONTEND_STATIC_PORT)
#
#   sudo cp nginx/host-production.live.conf /etc/nginx/sites-available/ummah-tech-fest
#   sudo ln -sf /etc/nginx/sites-available/ummah-tech-fest /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream utf_backend {
    server 127.0.0.1:8200;
    keepalive 16;
}

upstream utf_frontend {
    server 127.0.0.1:8082;
    keepalive 8;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ummahtechfest.com www.ummahtechfest.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ummahtechfest.com www.ummahtechfest.com;

    ssl_certificate /etc/letsencrypt/live/ummahtechfest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ummahtechfest.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 105M;

    location /api/ {
        proxy_pass http://utf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # /admin/* is the React CMS (frontend SPA) — do not proxy to Django.

    location /media/ {
        proxy_pass http://utf_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://utf_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://utf_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

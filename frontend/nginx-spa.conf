server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Public folder assets (images, video) — serve file or 404, never fall through to index.html
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /favicon.png {
        try_files $uri =404;
        expires 7d;
    }

    location = /favicon.svg {
        try_files $uri =404;
        expires 7d;
    }

    # React admin CMS — deep links must fall back to index.html on refresh
    location ^~ /admin {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

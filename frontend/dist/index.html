    <title>UMMAH TECH FEST GHANA 2026</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/boot-loader.css" />
    <style>
      html,
      body {
        background-color: #131313 !important;
        color: #e5e2e1;
        min-height: 100vh;
        margin: 0;
      }
      #root:empty + #boot-status {
        display: flex;
      }
      #boot-status {
        display: none;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-xyoZFxdG.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B5N5vkWb.css">
  </head>
  <body class="bg-background text-on-background font-body selection:bg-primary-fixed selection:text-on-primary-fixed">
    <div id="root"></div>
    <div id="boot-status" class="boot-loader" role="status" aria-busy="true" aria-live="polite">
      <div class="boot-loader__stage">
        <div class="boot-loader__glow" aria-hidden="true"></div>
        <div class="boot-loader__ring" aria-hidden="true"></div>
        <div class="boot-loader__logo-wrap">
          <img
            src="/assets/images/Ummah-tech-Fest-logo.png"
            alt=""
            class="boot-loader__logo"
            width="68"
            height="68"
            decoding="async"
          />
        </div>
      </div>
      <div class="boot-loader__track" aria-hidden="true">
        <span class="boot-loader__bar"></span>
      </div>
      <p class="boot-loader__label" aria-hidden="true">Ummah Tech Fest</p>
      <span class="boot-loader__sr-only">Loading application</span>
    </div>
    <script>
      (function () {
        var status = document.getElementById('boot-status')
        function showError(msg) {
          if (!status || status.dataset.failed) return
          status.dataset.failed = '1'
          status.setAttribute('aria-busy', 'false')
          status.innerHTML =
            '<div class="boot-error">' +
            '<strong>Something went wrong</strong>' +
            '<p>' + msg + '</p>' +
            '<button onclick="location.reload()">Refresh page</button>' +
            '</div>'
        }
        window.addEventListener('error', function (e) {
          var src = e.filename || ''
          if (src.indexOf('/assets/') !== -1 || src.indexOf('main') !== -1) {
            showError('The page failed to load. Please refresh — if the problem persists, try clearing your browser cache.')
          }
        })
        window.addEventListener('unhandledrejection', function (e) {
          var msg = e.reason && (e.reason.message || String(e.reason))
          if (msg && (msg.indexOf('import') !== -1 || msg.indexOf('Failed to fetch') !== -1)) {
            showError('A resource could not be loaded. Please check your connection and refresh.')
          }
        })
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && root.childNodes.length === 0) {
            showError('The app is taking longer than expected to start. Please refresh the page.')
          }
        }, 8000)
      })()
    </script>
  </body>
</html>
